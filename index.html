<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário & Leitura Bíblica</title>
  <!-- Fontes Literárias Clássicas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #181512;
      --bg-card: #221d18;
      --bg-input: #1b1713;
      --border: #382e25;
      --border-accent: #544436;
      --text-gold: #d4af37;
      --text-gold-light: #f3e5ab;
      --text-main: #e2d8ce;
      --text-muted: #9c8e80;
      --accent-red: #8b3a3a;
      --accent-green: #3a6b4c;
      --font-title: 'Cinzel', serif;
      --font-body: 'Lora', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.7;
      padding-bottom: 60px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Cabeçalho */
    header {
      padding: 40px 0 20px;
      text-align: center;
      border-bottom: 2px solid var(--border);
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      color: var(--text-gold);
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.95rem;
    }

    /* Navegação / Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }

    .tab-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 18px;
      font-family: var(--font-title);
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--text-gold);
      color: var(--text-gold-light);
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      border-color: var(--text-gold);
      color: var(--text-gold);
      box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Estilos Gerais de Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-family: var(--font-title);
      color: var(--text-gold);
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Seção de Progresso da Bíblia */
    .progress-overview {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .progress-stats {
      font-family: var(--font-title);
      font-size: 1.4rem;
      color: var(--text-gold);
      margin-bottom: 8px;
    }

    .progress-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .progress-bar-bg {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #8a6d27, var(--text-gold));
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .testament-title {
      font-family: var(--font-title);
      color: var(--text-gold-light);
      font-size: 1.1rem;
      margin: 24px 0 14px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border);
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .book-item {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      font-size: 0.88rem;
    }

    .book-item:hover {
      border-color: var(--text-gold);
    }

    .book-item.checked {
      background-color: #242a20;
      border-color: var(--accent-green);
      color: #a3d9b1;
    }

    .book-item input[type="checkbox"] {
      accent-color: var(--text-gold);
      cursor: pointer;
    }

    /* Formulario Devocional */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: var(--font-title);
      font-size: 0.8rem;
      color: var(--text-gold-light);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    input[type="text"], input[type="date"], textarea, select {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 0.95rem;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--text-gold);
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
    }

    .btn-submit {
      background-color: var(--text-gold);
      color: #120e0b;
      border: none;
      padding: 12px 24px;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--text-gold-light);
    }

    /* Lista de Registros */
    .entry-card {
      position: relative;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .entry-passage {
      font-family: var(--font-title);
      color: var(--text-gold);
      font-size: 1.1rem;
    }

    .entry-date {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .entry-verse {
      background-color: var(--bg-input);
      border-left: 3px solid var(--text-gold);
      padding: 10px 14px;
      font-style: italic;
      margin-bottom: 14px;
      color: var(--text-gold-light);
    }

    .entry-section {
      margin-bottom: 12px;
    }

    .entry-section-title {
      font-family: var(--font-title);
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 10px;
      opacity: 0.7;
    }

    .btn-delete:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .books-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }
  </style>
</head>
<body>

  <header class="container">
    <h1>DIÁRIO & LEITURA</h1>
    <p>"Lâmpada para os meus pés é tua palavra e luz, para o meu caminho." — Salmos 119:105</p>
  </header>

  <main class="container">

    <!-- Navegação -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('diario')">Devocionais</button>
      <button class="tab-btn" onclick="switchTab('progresso')">Livros Lidos (<span id="tab-count">0</span>/66)</button>
    </div>

    <!-- ABA 1: DEVOCIONAIS -->
    <div id="tab-diario" class="tab-content active">
      
      <!-- Formulário -->
      <div class="card">
        <div class="card-title">Novo Registro Devocional</div>
        <form id="devocional-form">
          <div class="form-row">
            <div class="form-group">
              <label for="passage">Passagem / Livro</label>
              <input type="text" id="passage" placeholder="Ex: Romanos 8:1-11" required>
            </div>
            <div class="form-group">
              <label for="date">Data</label>
              <input type="date" id="date" required>
            </div>
          </div>

          <div class="form-group">
            <label for="key-verse">Versículo em Destaque</label>
            <textarea id="key-verse" rows="2" placeholder="Digite o texto do versículo marcante..."></textarea>
          </div>

          <div class="form-group">
            <label for="reflection">Reflexão & Aplicação Pessoal</label>
            <textarea id="reflection" rows="4" placeholder="O que Deus falou com você através dessa leitura?" required></textarea>
          </div>

          <div class="form-group">
            <label for="prayer">Oração / Pedidos</label>
            <textarea id="prayer" rows="2" placeholder="Sua oração ou motivos de gratidão de hoje..."></textarea>
          </div>

          <button type="submit" class="btn-submit">GUARDAR DEVOCIONAL</button>
        </form>
      </div>

      <!-- Feed de Devocionais Registrados -->
      <div id="entries-container">
        <!-- Entradas salvas aparecem aqui -->
      </div>
    </div>

    <!-- ABA 2: PROGRESSO DOS 66 LIVROS -->
    <div id="tab-progresso" class="tab-content">
      
      <div class="progress-overview">
        <div class="progress-stats" id="progress-text">0 de 66 livros lidos</div>
        <div class="progress-sub" id="progress-sub">Faltam 66 livros para concluir a Bíblia</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="card">
        <div class="testament-title">ANTIGO TESTAMENTO (39 Livros)</div>
        <div class="books-grid" id="ot-grid"></div>

        <div class="testament-title" style="margin-top: 30px;">NOVO TESTAMENTO (27 Livros)</div>
        <div class="books-grid" id="nt-grid"></div>
      </div>

    </div>

  </main>

  <script>
    // Lista dos 66 Livros
    const otBooks = [
      "Gênesis", "Êxodo", "Levítico", "Números", "Deuteronômio", "Josué", "Juízes", "Rute",
      "1 Samuel", "2 Samuel", "1 Reis", "2 Reis", "1 Crônicas", "2 Crônicas", "Esdras", "Neemias",
      "Ester", "Jó", "Salmos", "Provérbios", "Eclesiastes", "Cânticos", "Isaías", "Jeremias",
      "Lamentações", "Ezequiel", "Daniel", "Oséias", "Joel", "Amós", "Obadias", "Jonas",
      "Miquéias", "Naum", "Habacuque", "Sofonias", "Ageu", "Zacarias", "Malaquias"
    ];

    const ntBooks = [
      "Mateus", "Marcos", "Lucas", "João", "Atos", "Romanos", "1 Coríntios", "2 Coríntios",
      "Gálatas", "Efésios", "Filipenses", "Colossenses", "1 Tessalonicenses", "2 Tessalonicenses",
      "1 Timóteo", "2 Timóteo", "Tito", "Filemom", "Hebreus", "Tiago", "1 Pedro", "2 Pedro",
      "1 João", "2 João", "3 João", "Judas", "Apocalipse"
    ];

    // Gerenciamento de Abas
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if(tabName === 'diario') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-diario').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-progresso').classList.add('active');
      }
    }

    // Data Padrão Hoje
    document.getElementById('date').valueAsDate = new Date();

    // Carregar e Salvar Progresso Bíblico
    function loadBibleProgress() {
      const readBooks = JSON.parse(localStorage.getItem('my_read_books') || '[]');
      
      const renderGrid = (books, gridId) => {
        const grid = document.getElementById(gridId);
        grid.innerHTML = '';
        books.forEach(book => {
          const isRead = readBooks.includes(book);
          const item = document.createElement('label');
          item.className = `book-item ${isRead ? 'checked' : ''}`;
          item.innerHTML = `
            <input type="checkbox" value="${book}" ${isRead ? 'checked' : ''} onchange="toggleBook('${book}')">
            <span>${book}</span>
          `;
          grid.appendChild(item);
        });
      };

      renderGrid(otBooks, 'ot-grid');
      renderGrid(ntBooks, 'nt-grid');
      updateProgressStats(readBooks.length);
    }

    function toggleBook(bookName) {
      let readBooks = JSON.parse(localStorage.getItem('my_read_books') || '[]');
      if (readBooks.includes(bookName)) {
        readBooks = readBooks.filter(b => b !== bookName);
      } else {
        readBooks.push(bookName);
      }
      localStorage.setItem('my_read_books', JSON.stringify(readBooks));
      loadBibleProgress();
    }

    function updateProgressStats(count) {
      const percentage = Math.round((count / 66) * 100);
      const remaining = 66 - count;
      
      document.getElementById('progress-text').innerText = `${count} de 66 livros lidos (${percentage}%)`;
      document.getElementById('progress-sub').innerText = remaining > 0 ? `Faltam ${remaining} livros para concluir a Bíblia` : 'Parabéns! Você concluiu a leitura de toda a Bíblia!';
      document.getElementById('progress-fill').style.width = `${percentage}%`;
      document.getElementById('tab-count').innerText = count;
    }

    // Carregar e Salvar Devocionais
    const form = document.getElementById('devocional-form');
    
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newEntry = {
        id: Date.now(),
        passage: document.getElementById('passage').value,
        date: document.getElementById('date').value,
        verse: document.getElementById('key-verse').value,
        reflection: document.getElementById('reflection').value,
        prayer: document.getElementById('prayer').value
      };

      const entries = JSON.parse(localStorage.getItem('my_devotionals') || '[]');
      entries.unshift(newEntry);
      localStorage.setItem('my_devotionals', JSON.stringify(entries));

      form.reset();
      document.getElementById('date').valueAsDate = new Date();
      loadDevotionals();
    });

    function loadDevotionals() {
      const entries = JSON.parse(localStorage.getItem('my_devotionals') || '[]');
      const container = document.getElementById('entries-container');
      container.innerHTML = '';

      if (entries.length === 0) {
        container.innerHTML = `<div class="card" style="text-align: center; color: var(--text-muted);">Nenhum devocional registrado ainda.</div>`;
        return;
      }

      entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'card entry-card';
        
        // Formatar data
        const [year, month, day] = entry.date.split('-');
        const formattedDate = `${day}/${month}/${year}`;

        card.innerHTML = `
          <div class="entry-header">
            <div class="entry-passage">${entry.passage}</div>
            <div class="entry-date">${formattedDate}</div>
          </div>
          ${entry.verse ? `<div class="entry-verse">"${entry.verse}"</div>` : ''}
          <div class="entry-section">
            <div class="entry-section-title">Reflexão</div>
            <div>${entry.reflection.replace(/\n/g, '<br>')}</div>
          </div>
          ${entry.prayer ? `
            <div class="entry-section" style="margin-top: 10px;">
              <div class="entry-section-title">Oração</div>
              <div style="color: var(--text-gold-light); font-style: italic;">${entry.prayer.replace(/\n/g, '<br>')}</div>
            </div>
          ` : ''}
          <button class="btn-delete" onclick="deleteEntry(${entry.id})">Apagar registro</button>
        `;
        container.appendChild(card);
      });
    }

    function deleteEntry(id) {
      if (confirm('Tem certeza que deseja apagar este devocional?')) {
        let entries = JSON.parse(localStorage.getItem('my_devotionals') || '[]');
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('my_devotionals', JSON.stringify(entries));
        loadDevotionals();
      }
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      loadBibleProgress();
      loadDevotionals();
    });
  </script>
</body>
</html>
